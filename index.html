  "description": "現在時刻をHH:MM:SS形式のQRコードで表示する無料のブラウザ時計。点が滑らかに動いて毎秒更新され、昼夜の配色と、丸・四角のスタイル切り替えに対応しています。",

<body>
  <main aria-labelledby="clock-title">
    <h1 class="visually-hidden" id="clock-title">二次元コード時計</h1>
    <time class="visually-hidden" id="time"></time>
    <div class="clock" aria-hidden="true">
      <canvas id="matrix"></canvas>
      <canvas id="finder-cues"></canvas>
      <span class="dial"></span>
    </div>
    <noscript>時計の表示には JavaScript が必要です。</noscript>
  </main>
  <button class="settings-button" id="settings-button" type="button"
    aria-label="表示設定" aria-haspopup="dialog" aria-controls="settings-drawer" aria-expanded="false">
    <span aria-hidden="true">⚙︎</span>
  </button>
  <dialog class="settings-drawer" id="settings-drawer" aria-labelledby="settings-title">
    <header class="settings-header">
      <h2 id="settings-title">設定</h2>
      <button class="close-button" id="settings-close" type="button" aria-label="設定を閉じる" autofocus>
        <span aria-hidden="true"></span>
      </button>
    </header>
    <fieldset class="style-choices">
      <legend>点の形</legend>
      <label class="style-option">
        <img src="./assets/style-round.png" alt="" width="112" height="112">
        <span>まる</span>
        <input type="radio" name="dot-style" value="round" checked>
      </label>
      <label class="style-option">
        <img src="./assets/style-square.png" alt="" width="112" height="112">
        <span>しかく</span>
        <input type="radio" name="dot-style" value="square">
      </label>
    </fieldset>
    <p class="settings-status" id="settings-status" role="status" hidden>このブラウザでは設定を保存できません。ページを開いている間は選択が反映されます。</p>
    <section class="settings-language" aria-labelledby="language-title">
      <h3 id="language-title">言語 / Language</h3>
      <nav class="language-links" aria-label="表示言語">
        <a href="./" lang="ja" hreflang="ja" aria-current="page">日本語</a>
        <a href="./en/" lang="en" hreflang="en">English</a>
      </nav>
    </section>
    <section class="settings-about" aria-labelledby="about-title">
      <h3 id="about-title">この時計について</h3>
      <p>QRコードを読み取ると、このブラウザの現在時刻が24時間表記（HH:MM:SS）でわかります。点は毎秒動き、時間帯に合わせて配色が変わります。</p>
    </section>
  </dialog>
